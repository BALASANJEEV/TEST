<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login Page</title>
    <style>
        /* Reset basic styles and define typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Center everything on the viewport with a soft background gradient */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        /* Container limits width and adds standard padding */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* White card styling with subtle depth shadows */
        .login-form {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        /* Header typography styling */
        .login-form h2 {
            color: #333333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .login-form p {
            color: #666666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Stack inputs on top of each other */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #444444;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* Form fields layout and micro-interactions */
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }

        /* Align links and checkboxes horizontally */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .remember-me {
            color: #555555;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .forgot-password {
            color: #4a90e2;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Interactive call to action button styling */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-btn:hover {
            background-color: #357abd;
        }

        /* Footer layout for secondary redirection links */
        .signup-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666666;
        }

        .signup-link a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <form class="login-form">
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in.</p>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Log In</button>

            <p class="signup-link">Don't have an account? <a href="#">Sign up</a></p>
        </form>
    </div>

</body>
</html>
